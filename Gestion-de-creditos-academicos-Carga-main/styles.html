<style>
/* Professional theme - Enhanced */
:root {
  --primary-color: #1E2F8C;
  --primary-hover: #152266;
  --secondary-color: #e9ecef;
  --success-color: #28a745;
  --warning-color: #ffc107;
  --danger-color: #dc3545;
  --info-color: #17a2b8;
  --text-primary: #2c3e50;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --card-shadow: 0 4px 12px rgba(0,0,0,0.08);
  --spacing-xs: 8px;
  --spacing-sm: 12px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --border-radius: 8px;
  --border-radius-sm: 6px;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
  color: var(--text-primary);
  line-height: 1.5;
  padding: 0;
  margin: 0;
  min-height: 100vh;
}

.main-container {
  max-width: 800px;
  margin: var(--spacing-lg) auto;
  padding: var(--spacing-xl);
  background-color: white;
  box-shadow: var(--card-shadow);
  border-radius: var(--border-radius);
  border: 1px solid rgba(0,0,0,0.05);
}

.content-wrapper {
  background-color: white;
  border-radius: var(--border-radius);
  padding: var(--spacing-lg);
  margin-bottom: var(--spacing-lg);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid rgba(0,0,0,0.03);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary-color) 0%, #4151B0 100%);
  border: 1px solid var(--primary-color);
  transition: all 0.25s ease;
  padding: var(--spacing-sm) var(--spacing-lg);
  font-weight: 600;
  font-size: 14px;
  color: #fff;
  border-radius: var(--border-radius-sm);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  box-shadow: 0 2px 4px rgba(30, 47, 140, 0.2);
}

.btn-primary:hover { 
  background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary-color) 100%); 
  transform: translateY(-1px); 
  box-shadow: 0 4px 8px rgba(30, 47, 140, 0.3);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.search-form { 
  background-color: white; 
  padding: var(--spacing-xl); 
  border-radius: var(--border-radius); 
  box-shadow: var(--card-shadow); 
  margin-bottom: var(--spacing-lg);
  border: 1px solid var(--border-color);
}

.form-label { 
  font-weight: 600; 
  color: var(--text-primary); 
  margin-bottom: var(--spacing-xs);
  display: block;
  font-size: 14px;
  letter-spacing: 0.01em;
}

.form-control { 
  border-radius: var(--border-radius-sm); 
  border: 1px solid var(--border-color); 
  padding: var(--spacing-sm) var(--spacing-md);
  font-size: 14px;
  line-height: 1.5;
  transition: all 0.2s ease;
  width: 100%;
  min-height: 42px;
  background-color: #fff;
}

.form-control:focus { 
  border-color: var(--primary-color); 
  box-shadow: 0 0 0 3px rgba(30, 47, 140, 0.1);
  outline: none;
}

/* Form field spacing and structure */
.form-group {
  margin-bottom: var(--spacing-lg);
}

.form-group:last-child {
  margin-bottom: 0;
}

.meta { 
  font-size: 13px; 
  color: var(--text-secondary); 
  line-height: 1.4;
}

/* Selected student name (when a suggestion is chosen) */
#selectedName {
  font-size: 14px;
  color: var(--text-primary);
  margin-top: var(--spacing-sm);
  padding: var(--spacing-sm) var(--spacing-md);
  background: #f8f9fa;
  border-radius: var(--border-radius-sm);
  border-left: 3px solid transparent;
  transition: all 0.3s ease;
  min-height: 20px;
}

.selected-large {
  font-size: 18px;
  font-weight: 600;
  color: var(--primary-color);
  background: rgba(30, 47, 140, 0.05);
  border-left-color: var(--primary-color);
  box-shadow: 0 2px 4px rgba(30, 47, 140, 0.1);
}

/* Autocomplete suggestions */
.suggestions-list{ 
  position: absolute; 
  left: 0; 
  right: 0; 
  background: #fff; 
  border-radius: var(--border-radius); 
  box-shadow: 0 8px 24px rgba(0,0,0,0.12); 
  overflow: auto; 
  max-height: 240px; 
  z-index: 999;
  border: 1px solid var(--border-color);
  margin-top: 2px;
}

.suggestion-item{ 
  padding: var(--spacing-md); 
  border-bottom: 1px solid rgba(0,0,0,0.05); 
  cursor: pointer;
  transition: background-color 0.15s ease;
}

.suggestion-item:hover{ 
  background: rgba(30, 47, 140, 0.05);
}

.suggestion-item:last-child {
  border-bottom: none;
}

/* Form layout: organized rows */
.form-row { 
  display: flex; 
  gap: var(--spacing-md); 
  align-items: flex-end; 
  margin-bottom: var(--spacing-lg);
}

.form-col { 
  flex: 1; 
}

.form-col-fixed { 
  flex: 0 0 160px; 
}

.file-upload-section {
  display: flex;
  gap: var(--spacing-md);
  align-items: flex-end;
  flex-wrap: wrap;
}

.file-col { 
  flex: 1; 
  min-width: 200px;
}

.button-col {
  flex: 0 0 auto;
}

/* Error styles */
.text-danger {
  color: var(--danger-color);
  font-size: 12px;
  margin-top: var(--spacing-xs);
}

.d-none {
  display: none !important;
}

/* Message styling */
#mensaje {
  margin-top: var(--spacing-md);
  padding: var(--spacing-sm) var(--spacing-md);
  border-radius: var(--border-radius-sm);
  font-weight: 500;
  min-height: 20px;
  transition: all 0.3s ease;
}

/* Responsive design */
@media (max-width: 768px) { 
  .main-container { 
    margin: var(--spacing-sm); 
    padding: var(--spacing-lg); 
  }
  
  .form-row { 
    display: block; 
  }
  
  .form-row > * {
    margin-bottom: var(--spacing-md);
  }
  
  .form-row > *:last-child {
    margin-bottom: 0;
  }
  
  .file-upload-section {
    display: block;
  }
  
  .button-col {
    margin-top: var(--spacing-md);
    text-align: center;
  }
}
</style>
<style>
/* Upload loader styles */
.loader-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:3000 }
.loader-box { background:#fff; padding:20px 24px; border-radius:8px; width:360px; max-width:90%; text-align:left }
.loader-title { font-weight:600; color:var(--primary-color); margin-bottom:8px }
.progress-bar { width:100%; height:12px; background:#e9ecef; border-radius:8px; overflow:hidden; margin-top:8px }
.progress-fill { width:0%; height:100%; background:linear-gradient(90deg,var(--primary-color),#4151B0); transition:width 300ms linear }
.loader-percent { float:right; font-weight:600; color:#333 }
.loader-sub { margin-top:10px; color:#666; font-size:13px }
</style>
</style>
